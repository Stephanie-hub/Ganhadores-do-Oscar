<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎬 Roleta do Oscar · Steph & Val</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% -10%, #3f1a2a 0%, transparent 60%),
                  linear-gradient(145deg, #0d0709 0%, #1e0f14 70%, #0d0709 100%);
      font-family: 'Barlow', sans-serif;
      color: #f5eede;
      padding: 18px 14px 60px;
      overflow-x: hidden;
    }
    /* --- cabeçalho --- */
    .marquee {
      position: relative;
      text-align: center;
      padding: 24px 16px 18px;
      margin-bottom: 22px;
      border: 2px solid #d4af37;
      border-radius: 60px 60px 30px 30px;
      background: linear-gradient(180deg, #2d111a, #190b10);
      box-shadow: 0 10px 35px rgba(0,0,0,.7), inset 0 0 40px rgba(212,175,55,.15);
    }
    .marquee::before {
      content: '✦';
      position: absolute;
      left: 20px; top: 10px;
      font-size: 18px; color: #d4af37; opacity: .6;
    }
    .marquee::after {
      content: '✦';
      position: absolute;
      right: 20px; top: 10px;
      font-size: 18px; color: #d4af37; opacity: .6;
    }
    .marquee h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(28px, 9vw, 44px);
      letter-spacing: 1px;
      margin: 0 0 2px;
      color: #eedbba;
      text-shadow: 0 2px 8px #00000080, 0 0 30px #d4af3740;
    }
    .marquee h1 i { font-style: normal; color: #d4af37; }
    .marquee .sub {
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 4px;
      font-size: 14px;
      color: #dcc9a6;
      opacity: .9;
    }
    .marquee .sub span { color: #f5b7b7; font-weight: 700; }
    #counterText {
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 2px;
      margin-top: 4px;
      opacity: .8;
      font-size: 15px;
    }
    /* --- roleta --- */
    .reel-wrap {
      position: relative;
      margin: 0 auto 12px;
      max-width: 540px;
    }
    .sprockets {
      height: 12px;
      background: #1b0c10;
      background-image: radial-gradient(circle, #6a1c26 2.8px, transparent 3.2px);
      background-size: 28px 12px;
      background-repeat: repeat-x;
      background-position: center;
      border-radius: 4px;
    }
    .reel-gate {
      position: relative;
      overflow: hidden;
      background: repeating-linear-gradient(45deg, #1e0d12, #1e0d12 8px, #261016 8px, #261016 16px);
      border-left: 4px solid #0d0709;
      border-right: 4px solid #0d0709;
      height: 140px;
      display: flex;
      align-items: center;
    }
    .reel-track {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      will-change: transform;
      transform: translateX(0);
    }
    .reel-card {
      flex: 0 0 auto;
      width: 152px;
      height: 108px;
      background: linear-gradient(150deg, #f3e3c9, #ddcbab);
      color: #1a0c0e;
      border-radius: 12px 4px 12px 4px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px 10px;
      box-shadow: inset 0 0 0 2px rgba(120,60,40,.2), 0 4px 12px #00000055;
    }
    .reel-card::before, .reel-card::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      background: #1e0d12;
      border-radius: 50%;
      top: 50%; transform: translateY(-50%);
      box-shadow: inset 0 2px 4px #00000080;
    }
    .reel-card::before { left: -8px; }
    .reel-card::after { right: -8px; }
    .reel-card .yr {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      color: #8f2a33;
      margin-bottom: 2px;
    }
    .reel-card .tt {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 15px;
      line-height: 1.1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .reel-card .cat-badge {
      font-size: 9px;
      background: #8f2a33;
      color: #f5eede;
      padding: 1px 8px;
      border-radius: 20px;
      margin-top: 2px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .gate-pointer {
      position: absolute;
      left: 50%; top: -6px;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 16px solid #d4af37;
      filter: drop-shadow(0 2px 6px #00000099);
      z-index: 4;
    }
    .gate-pointer.bottom { top: auto; bottom: -6px; transform: translateX(-50%) rotate(180deg); }
    .gate-center-line {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 2px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, transparent, rgba(212,175,55,.6), transparent);
      z-index: 2;
      pointer-events: none;
    }
    .gate-fade {
      position: absolute; top: 0; bottom: 0; width: 70px; z-index: 2; pointer-events: none;
    }
    .gate-fade.left { left: 0; background: linear-gradient(90deg, #1a0a0e, transparent); }
    .gate-fade.right { right: 0; background: linear-gradient(270deg, #1a0a0e, transparent); }
    /* --- botão girar --- */
    .spin-btn {
      display: block;
      margin: 18px auto 20px;
      width: min(290px, 86%);
      padding: 16px 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #1e0c0e;
      background: linear-gradient(180deg, #f7e5b7, #d4af37);
      border: none;
      border-radius: 999px;
      box-shadow: 0 8px 24px #00000077, inset 0 2px 0 #fff9e0;
      cursor: pointer;
      transition: transform .12s ease;
    }
    .spin-btn:active { transform: scale(.96); }
    .spin-btn:disabled { opacity: .4; cursor: default; transform: scale(1); }
    .empty-msg {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: #e0ca9e;
      margin: 10px 0 18px;
      padding: 0 10px;
      background: #1f0f1480;
      border-radius: 40px;
      padding: 14px;
    }
    /* --- abas --- */
    .tabs {
      display: flex;
      gap: 10px;
      max-width: 520px;
      margin: 8px auto 16px;
      flex-wrap: wrap;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      border-radius: 40px;
      border: 2px solid #4d131b;
      background: #140a0d80;
      color: #dcc9a6;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      letter-spacing: 1.5px;
      font-size: 16px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s;
      min-width: 80px;
    }
    .tab-btn.active {
      background: linear-gradient(180deg, #36141d, #1f0d14);
      border-color: #d4af37;
      color: #eedbba;
      box-shadow: 0 0 20px #d4af3720;
    }
    /* --- formulário add filme --- */
    .add-form {
      max-width: 520px;
      margin: 0 auto 16px;
      background: #1f0f1480;
      border-radius: 20px;
      padding: 16px 18px;
      border: 1px solid rgba(212,175,55,.15);
      backdrop-filter: blur(2px);
    }
    .add-form label {
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 1px;
      font-size: 13px;
      color: #dcc9a6;
      display: block;
      margin-bottom: 4px;
    }
    .add-form .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .add-form .row input, .add-form .row select {
      flex: 1;
      min-width: 100px;
      padding: 10px 12px;
      border-radius: 30px;
      border: 1px solid #4d131b;
      background: #0d0709cc;
      color: #f5eede;
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      outline: none;
      transition: .2s;
    }
    .add-form .row input:focus, .add-form .row select:focus {
      border-color: #d4af37;
      box-shadow: 0 0 20px #d4af3720;
    }
    .add-form .row input::placeholder { color: #6b5a4a; }
    .add-form .row select option { background: #1e0f14; }
    .add-btn {
      padding: 10px 20px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(180deg, #f7e5b7, #d4af37);
      color: #1a0c0e;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .15s;
      min-width: 100px;
    }
    .add-btn:active { transform: scale(.95); }
    .add-btn:disabled { opacity: .4; cursor: default; }
    .add-form .cat-hint {
      font-size: 11px;
      color: #6b5a4a;
      margin-top: 6px;
      text-align: center;
    }
    /* --- listas --- */
    .list-wrap { max-width: 520px; margin:0 auto; }
    .movie-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(160deg, rgba(246,234,208,.07), rgba(246,234,208,.02));
      border: 1px solid rgba(212,175,55,.2);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      backdrop-filter: blur(2px);
      flex-wrap: wrap;
    }
    .movie-row .badge-year {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #1e0c0e;
      background: #e6cf9e;
      padding: 3px 12px;
      border-radius: 30px;
      flex: 0 0 auto;
    }
    .movie-row .m-title {
      flex: 1;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 500;
      min-width: 120px;
    }
    .movie-row .cat-tag {
      font-size: 10px;
      background: #4d131b;
      color: #e6cf9e;
      padding: 2px 10px;
      border-radius: 20px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: .5px;
      text-transform: uppercase;
      flex: 0 0 auto;
    }
    .movie-row .stars {
      display: flex;
      gap: 2px;
      flex: 0 0 auto;
    }
    .movie-row .stars button {
      background: none; border: none; padding: 0 2px; cursor: pointer;
      font-size: 18px; line-height: 1; color: rgba(246,234,208,.2);
      transition: .15s;
    }
    .movie-row .stars button.filled { color: #d4af37; text-shadow: 0 0 8px #d4af3760; }
    .movie-row .undo-btn {
      flex: 0 0 auto;
      background: none;
      border: 1px solid rgba(212,175,55,.3);
      color: #dcc9a6;
      border-radius: 30px;
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      text-transform: uppercase;
      letter-spacing: .5px;
      transition: .15s;
    }
    .movie-row .undo-btn:hover { background: #d4af3720; }
    .movie-row .del-btn {
      flex: 0 0 auto;
      background: none;
      border: none;
      color: #6b2a33;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      transition: .15s;
    }
    .movie-row .del-btn:hover { color: #9c1f27; }
    .empty-list {
      text-align: center;
      color: rgba(246,234,208,.4);
      font-size: 15px;
      padding: 40px 10px;
      font-style: italic;
    }
    /* --- overlay bilhete --- */
    .overlay {
      position: fixed; inset:0;
      background: rgba(8,3,5,.85);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      z-index: 60;
      opacity:0; pointer-events:none;
      transition: opacity .3s ease;
      backdrop-filter: blur(6px);
    }
    .overlay.show { opacity:1; pointer-events:auto; }
    .ticket {
      width: 100%; max-width: 380px;
      background: linear-gradient(160deg, #f5e6ce, #e2cba8);
      color: #1a0c0e;
      border-radius: 36px 12px 36px 12px;
      padding: 32px 24px 24px;
      text-align: center;
      position: relative;
      box-shadow: 0 30px 80px #000000cc, 0 0 0 2px #d4af37 inset;
      transform: scale(.92);
      transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
    }
    .overlay.show .ticket { transform: scale(1); }
    .ticket .eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 13px;
      color: #8f2a33;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .ticket h2 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      margin: 0 0 4px;
      line-height: 1.2;
    }
    .ticket .yr2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      color: #6b4f2a;
      margin-bottom: 4px;
    }
    .ticket .cat2 {
      font-size: 13px;
      color: #8f2a33;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .rate-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #6b4f2a;
      margin-bottom: 8px;
    }
    .rate-stars {
      display: flex; justify-content: center; gap: 10px; margin-bottom: 24px;
    }
    .rate-stars button {
      background: none; border: none; font-size: 32px; cursor: pointer;
      color: rgba(0,0,0,.15); padding: 0; transition: .15s;
    }
    .rate-stars button.filled { color: #d4af37; text-shadow: 0 0 12px #d4af3770; }
    .ticket-actions { display: flex; gap: 12px; }
    .ticket-actions button {
      flex: 1;
      padding: 14px 8px;
      border-radius: 60px;
      border: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      letter-spacing: 1.5px;
      font-size: 16px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .15s;
    }
    .btn-confirm { background: linear-gradient(180deg, #f7e5b7, #d4af37); color: #1a0c0e; box-shadow: 0 4px 12px #00000044; }
    .btn-cancel { background: transparent; border: 2px solid #b8a476 !important; color: #4d341a; }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: rgba(246,234,208,.3);
      margin-top: 30px;
      letter-spacing: .5px;
    }
    .reset-link {
      background: none; border: none; color: rgba(246,234,208,.4);
      text-decoration: underline; font-size: 11px; cursor: pointer; margin-top: 4px;
      font-family: 'Barlow', sans-serif;
    }
    @media (max-width: 480px) {
      .add-form .row { flex-direction: column; }
      .add-form .row input, .add-form .row select { min-width: auto; }
      .add-btn { width: 100%; }
    }
  </style>
</head>
<body>

<div class="marquee">
  <h1>★ <i>Steph</i> & <i>Val</i> ★</h1>
  <div class="sub">🎞️ <span>OSCARS</span> · maratona do amor 🎞️</div>
  <div id="counterText">carregando...</div>
</div>

<!-- roleta -->
<div class="reel-wrap">
  <div class="sprockets"></div>
  <div class="reel-gate" id="reelGate">
    <div class="gate-fade left"></div>
    <div class="gate-fade right"></div>
    <div class="gate-center-line"></div>
    <div class="gate-pointer"></div>
    <div class="gate-pointer bottom"></div>
    <div class="reel-track" id="reelTrack"></div>
  </div>
  <div class="sprockets"></div>
</div>

<button class="spin-btn" id="spinBtn">🎬 girar roleta</button>
<div class="empty-msg" id="emptyMsg" style="display:none;">💖 todos vistos! <br> <span style="font-size:14px;">hora do playback duplo</span></div>

<!-- formulário adicionar filme -->
<div class="add-form">
  <div class="row">
    <input type="text" id="movieTitleInput" placeholder="Título do filme" style="flex:2;">
    <input type="number" id="movieYearInput" placeholder="Ano" min="1927" max="2026" style="flex:1; max-width:90px;">
    <select id="movieCategoryInput" style="flex:1.5;">
      <option value="Melhor Filme">🏆 Melhor Filme</option>
      <option value="Melhor Diretor">🎬 Melhor Diretor</option>
      <option value="Melhor Ator">🎭 Melhor Ator</option>
      <option value="Melhor Atriz">🎭 Melhor Atriz</option>
      <option value="Melhor Ator Coadjuvante">🎭 Melhor Ator Coadjuvante</option>
      <option value="Melhor Atriz Coadjuvante">🎭 Melhor Atriz Coadjuvante</option>
      <option value="Melhor Roteiro Original">✍️ Roteiro Original</option>
      <option value="Melhor Roteiro Adaptado">✍️ Roteiro Adaptado</option>
      <option value="Melhor Filme Internacional">🌍 Filme Internacional</option>
      <option value="Melhor Animação">🎨 Animação</option>
      <option value="Melhor Documentário">📽️ Documentário</option>
      <option value="Melhor Fotografia">📷 Fotografia</option>
      <option value="Melhor Trilha Sonora">🎵 Trilha Sonora</option>
      <option value="Melhor Canção Original">🎤 Canção Original</option>
      <option value="Melhor Montagem">✂️ Montagem</option>
      <option value="Melhor Direção de Arte">🎨 Direção de Arte</option>
      <option value="Melhor Figurino">👗 Figurino</option>
      <option value="Melhor Maquiagem">💄 Maquiagem</option>
      <option value="Melhor Som">🔊 Som</option>
      <option value="Melhores Efeitos Visuais">👽 Efeitos Visuais</option>
      <option value="Outra Categoria">🏅 Outra</option>
    </select>
    <button class="add-btn" id="addMovieBtn">➕ adicionar</button>
  </div>
  <div class="cat-hint">💡 escolha a categoria que o filme venceu no Oscar</div>
</div>

<!-- abas -->
<div class="tabs">
  <button class="tab-btn active" id="tabPending">📽️ por ver</button>
  <button class="tab-btn" id="tabWatched">✅ vistos</button>
</div>

<div class="list-wrap" id="listPending"></div>
<div class="list-wrap" id="listWatched" style="display:none;"></div>

<p class="footer-note">⭐ toque nas estrelas para avaliar · <button class="reset-link" id="resetBtn">reiniciar tudo</button></p>

<!-- overlay bilhete -->
<div class="overlay" id="overlay">
  <div class="ticket">
    <div class="eyebrow">🎟️ bilhete premiado</div>
    <h2 id="ticketTitle">—</h2>
    <div class="yr2" id="ticketYear">—</div>
    <div class="cat2" id="ticketCategory">—</div>
    <div class="rate-label">💫 avalie (opcional)</div>
    <div class="rate-stars" id="ticketStars"></div>
    <div class="ticket-actions">
      <button class="btn-cancel" id="btnCancel">passar</button>
      <button class="btn-confirm" id="btnConfirm">assistir 💕</button>
    </div>
  </div>
</div>

// --- estado
const STORAGE_KEY = 'oscar-roulette-steph-val-v2';
let state = null;
let spinning = false;
let pendingRating = 0;
let pendingTarget = null;

const els = {
  reelTrack: document.getElementById('reelTrack'),
  spinBtn: document.getElementById('spinBtn'),
  emptyMsg: document.getElementById('emptyMsg'),
  counterText: document.getElementById('counterText'),
  tabPending: document.getElementById('tabPending'),
  tabWatched: document.getElementById('tabWatched'),
  listPending: document.getElementById('listPending'),
  listWatched: document.getElementById('listWatched'),
  overlay: document.getElementById('overlay'),
  ticketTitle: document.getElementById('ticketTitle'),
  ticketYear: document.getElementById('ticketYear'),
  ticketCategory: document.getElementById('ticketCategory'),
  ticketStars: document.getElementById('ticketStars'),
  btnConfirm: document.getElementById('btnConfirm'),
  btnCancel: document.getElementById('btnCancel'),
  resetBtn: document.getElementById('resetBtn'),
  reelGate: document.getElementById('reelGate'),
  addBtn: document.getElementById('addMovieBtn'),
  titleInput: document.getElementById('movieTitleInput'),
  yearInput: document.getElementById('movieYearInput'),
  categoryInput: document.getElementById('movieCategoryInput'),
};

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) { 
    state = JSON.parse(saved);
    // garantir que filmes antigos tenham categoria
    state.pending = state.pending.map(m => ({ ...m, category: m.category || 'Melhor Filme' }));
    state.watched = state.watched.map(m => ({ ...m, category: m.category || 'Melhor Filme' }));
  } else { 
    state = { pending: BASE_MOVIES.map(m => ({...m})), watched: [] }; 
    saveState(); 
  }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function shuffle(arr) {
  const a = arr.slice();
  for (let i=a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function makeCard(movie) {
  const d = document.createElement('div');
  d.className = 'reel-card';
  d.innerHTML = `<div class="yr">${movie.year}</div><div class="tt">${movie.title}</div><div class="cat-badge">${movie.category || '🏆'}</div>`;
  return d;
}

function renderStaticReel() {
  els.reelTrack.style.transition = 'none';
  els.reelTrack.style.transform = 'translateX(0)';
  els.reelTrack.innerHTML = '';
  const showList = state.pending.length ? state.pending : [{year:'', title:'💖 todos vistos', category:''}];
  const display = shuffle(showList).slice(0, 12);
  const cycle = display.concat(display).concat(display);
  cycle.forEach(m => els.reelTrack.appendChild(makeCard(m)));
}

function updateCounter() {
  els.counterText.textContent = `${state.pending.length} por ver · ${state.watched.length} vistos`;
}

function renderLists() {
  updateCounter();
  // pending
  els.listPending.innerHTML = '';
  if (state.pending.length === 0) {
    els.listPending.innerHTML = '<div class="empty-list">🥂 nenhum filme por ver — vocês arrasaram!</div>';
  } else {
    state.pending.slice().sort((a,b) => b.year - a.year).forEach(m => {
      const row = document.createElement('div');
      row.className = 'movie-row';
      row.innerHTML = `
        <span class="badge-year">${m.year}</span>
        <span class="m-title">${m.title}</span>
        <span class="cat-tag">${m.category || '🏆'}</span>
        <button class="del-btn" data-id="${m.id}">✕</button>
      `;
      els.listPending.appendChild(row);
    });
    els.listPending.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const idx = state.pending.findIndex(x => x.id === id);
        if (idx > -1) {
          state.pending.splice(idx, 1);
          saveState();
          renderLists();
          renderStaticReel();
          toggleEmptyState();
        }
      });
    });
  }

  // watched
  els.listWatched.innerHTML = '';
  if (state.watched.length === 0) {
    els.listWatched.innerHTML = '<div class="empty-list">✨ ainda não assistiram nenhum juntas…</div>';
  } else {
    state.watched.slice().sort((a,b) => b.year - a.year).forEach(m => {
      const row = document.createElement('div');
      row.className = 'movie-row';
      const starsHtml = [1,2,3,4,5].map(n =>
        `<button data-id="${m.id}" data-n="${n}" class="star-edit ${n <= (m.rating||0) ? 'filled' : ''}">★</button>`
      ).join('');
      row.innerHTML = `
        <span class="badge-year">${m.year}</span>
        <span class="m-title">${m.title}</span>
        <span class="cat-tag">${m.category || '🏆'}</span>
        <span class="stars">${starsHtml}</span>
        <button class="undo-btn" data-id="${m.id}">↩</button>
        <button class="del-btn" data-id="${m.id}">✕</button>
      `;
      els.listWatched.appendChild(row);
    });
    els.listWatched.querySelectorAll('.star-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id, n = Number(btn.dataset.n);
        const movie = state.watched.find(x => x.id === id);
        if (movie) {
          movie.rating = (movie.rating === n) ? 0 : n;
          saveState();
          renderLists();
        }
      });
    });
    els.listWatched.querySelectorAll('.undo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const idx = state.watched.findIndex(x => x.id === id);
        if (idx > -1) {
          const [m] = state.watched.splice(idx, 1);
          delete m.rating;
          state.pending.push(m);
          saveState();
          renderLists();
          renderStaticReel();
          toggleEmptyState();
        }
      });
    });
    els.listWatched.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const idx = state.watched.findIndex(x => x.id === id);
        if (idx > -1) {
          state.watched.splice(idx, 1);
          saveState();
          renderLists();
        }
      });
    });
  }
}

function toggleEmptyState() {
  const empty = state.pending.length === 0;
  els.spinBtn.style.display = empty ? 'none' : 'block';
  els.emptyMsg.style.display = empty ? 'block' : 'none';
}

function switchTab(which) {
  const p = which === 'pending';
  els.tabPending.classList.toggle('active', p);
  els.tabWatched.classList.toggle('active', !p);
  els.listPending.style.display = p ? 'block' : 'none';
  els.listWatched.style.display = p ? 'none' : 'block';
}

function buildRateStars(container, initial, onChange) {
  container.innerHTML = '';
  for (let n=1; n<=5; n++) {
    const b = document.createElement('button');
    b.textContent = '★';
    b.dataset.n = n;
    if (n <= initial) b.classList.add('filled');
    b.addEventListener('click', () => onChange(n));
    container.appendChild(b);
  }
}

function refreshTicketStars() {
  buildRateStars(els.ticketStars, pendingRating, (n) => {
    pendingRating = (pendingRating === n) ? 0 : n;
    refreshTicketStars();
  });
}

// --- spin
async function spin() {
  if (spinning || state.pending.length === 0) return;
  spinning = true;
  els.spinBtn.disabled = true;

  const targetIndex = Math.floor(Math.random() * state.pending.length);
  const target = state.pending[targetIndex];

  const cardWidth = 152, gap = 12, step = cardWidth + gap;
  const loops = 5;
  let sequence = [];
  for (let i=0; i<loops; i++) {
    sequence = sequence.concat(shuffle(state.pending));
  }
  sequence.push(target);

  els.reelTrack.style.transition = 'none';
  els.reelTrack.style.transform = 'translateX(0)';
  els.reelTrack.innerHTML = '';
  sequence.forEach(m => els.reelTrack.appendChild(makeCard(m)));
  void els.reelTrack.offsetWidth;

  const gateWidth = els.reelGate.clientWidth;
  const targetIdxInSeq = sequence.length - 1;
  const targetCenter = 12 + targetIdxInSeq * step + cardWidth/2;
  const offset = targetCenter - gateWidth/2;

  requestAnimationFrame(() => {
    els.reelTrack.style.transition = 'transform 4.6s cubic-bezier(0.12,0.72,0.10,1)';
    els.reelTrack.style.transform = `translateX(-${offset}px)`;
  });

  const onEnd = () => {
    els.reelTrack.removeEventListener('transitionend', onEnd);
    spinning = false;
    els.spinBtn.disabled = false;
    openTicket(target);
  };
  els.reelTrack.addEventListener('transitionend', onEnd);
}

function openTicket(movie) {
  pendingTarget = movie;
  pendingRating = 0;
  els.ticketTitle.textContent = movie.title;
  els.ticketYear.textContent = `🏆 vencedor de ${movie.year}`;
  els.ticketCategory.textContent = movie.category || 'Melhor Filme';
  refreshTicketStars();
  els.overlay.classList.add('show');
}

function closeTicket() {
  els.overlay.classList.remove('show');
  pendingTarget = null;
}

async function confirmTicket() {
  if (!pendingTarget) return;
  const idx = state.pending.findIndex(m => m.id === pendingTarget.id);
  if (idx > -1) {
    const [m] = state.pending.splice(idx, 1);
    m.rating = pendingRating;
    state.watched.push(m);
    saveState();
    renderLists();
    renderStaticReel();
    toggleEmptyState();
  }
  closeTicket();
}

async function resetAll() {
  if (!confirm('💔 isso vai apagar todo o progresso. continuar?')) return;
  state = { pending: BASE_MOVIES.map(m => ({...m})), watched: [] };
  saveState();
  renderLists();
  renderStaticReel();
  toggleEmptyState();
}

// --- adicionar filme
function addMovie() {
  const title = els.titleInput.value.trim();
  const year = els.yearInput.value.trim();
  const category = els.categoryInput.value;

  if (!title) { alert('Por favor, insira o título do filme.'); return; }
  if (!year || isNaN(year) || year < 1927 || year > 2026) { alert('Insira um ano válido (1927-2026).'); return; }

  // verifica duplicado
  const exists = state.pending.some(m => m.title.toLowerCase() === title.toLowerCase() && m.year === year);
  if (exists) { alert('Esse filme já está na lista "por ver"!'); return; }

  const newMovie = {
    id: `${year}-${title}-${Date.now()}`,
    year: year,
    title: title,
    category: category,
  };
  state.pending.push(newMovie);
  saveState();
  renderLists();
  renderStaticReel();
  toggleEmptyState();
  els.titleInput.value = '';
  els.yearInput.value = '';
  els.titleInput.focus();
}

// --- eventos
els.spinBtn.addEventListener('click', spin);
els.btnConfirm.addEventListener('click', confirmTicket);
els.btnCancel.addEventListener('click', closeTicket);
els.tabPending.addEventListener('click', () => switchTab('pending'));
els.tabWatched.addEventListener('click', () => switchTab('watched'));
els.resetBtn.addEventListener('click', resetAll);
els.addBtn.addEventListener('click', addMovie);
els.titleInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') els.yearInput.focus(); });
els.yearInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addMovie(); });

// --- init
(async function init() {
  loadState();
  renderLists();
  renderStaticReel();
  toggleEmptyState();
})();
</script>
